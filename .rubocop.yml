AllCops:
  TargetRubyVersion: 2.6

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 300

Metrics/MethodLength:
  Max: 60

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  Max: 250

Metrics/BlockLength:
  Max: 150
  Exclude:
    - 'spec/**/*_spec.rb'

# Keyword arguments do not carry the positional-confusion risk this cop targets,
# and the mandate tags genuinely number what they number.
Metrics/ParameterLists:
  Max: 15
  CountKeywordArgs: false

Metrics/ModuleLength:
  Max: 150
